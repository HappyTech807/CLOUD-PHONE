name: Android Cloud Phone

on:
  workflow_dispatch:

jobs:
  cloud-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Maximize Disk Space & Prepare Environment
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Load Android Kernel Modules
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo systemctl enable --now tailscaled
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-android-cloud-$GITHUB_RUN_ID
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Start Redroid (Android Cloud Container)
        run: |
          docker run -d --privileged \
            --name redroid \
            --pull always \
            -p 5555:5555 \
            redroid/redroid:13.0.0-latest \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=1920 \
            androidboot.redroid_dpi=480 \
            androidboot.redroid_fps=30

      - name: Display Connection Credentials
        run: |
          echo "=========================================="
          echo "ANDROID CLOUD PHONE IS RUNNING"
          echo "Tailscale IP: $TAILSCALE_IP"
          echo "ADB Port: 5555"
          echo ""
          echo "Connect via ADB:"
          echo "  adb connect $TAILSCALE_IP:5555"
          echo ""
          echo "View/Control screen with scrcpy:"
          echo "  scrcpy -s $TAILSCALE_IP:5555"
          echo "=========================================="

      - name: Keep Runner Alive
        run: |
          while true; do
            echo "[$(date)] Android Cloud Phone alive at $TAILSCALE_IP:5555..."
            sleep 300
          done
